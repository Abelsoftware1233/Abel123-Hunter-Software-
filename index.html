<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Abel123 Hunter - B2B e-mailfinder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>
            <i class="fas fa-envelope"></i> Abel123 Hunter
        </h1>
        <div class="subhead">
            <i class="fas fa-search" style="margin-right: 10px; color: #2b6cf0;"></i>
            B2B e-mail finder· crawling · pattern recognition · SMTP-verification
        </div>

        <!-- Zoekformulier -->
        <div class="search-box">
            <input type="text" id="domainInput" placeholder="Bijv. company.nl of voorbeeld.com" value="example.com">
            <button id="searchBtn">
                <i class="fas fa-arrow-right"></i> Zoek e-mails
            </button>
        </div>

        <!-- Badges / database info -->
        <div class="badge-container">
            <span class="badge"><i class="fas fa-globe"></i> Web crawling</span>
            <span class="badge"><i class="fas fa-shield-alt"></i> Pattern Recognition</span>
            <span class="badge"><i class="fas fa-user-tie"></i> LinkedIn / registers</span>
            <span class="badge"><i class="fas fa-check-circle"></i> SMTP-verification</span>
        </div>

        <!-- Resultaat gebied -->
        <div class="result-area" id="resultArea">
            <div class="result-header">
                <h3><i class="fas fa-list-ul" style="margin-right: 10px; color:#2b6cf0;"></i>Found e-mailadress</h3>
                <span class="count" id="emailCount">0</span>
            </div>
            <div id="emailListContainer">
                <div class="placeholder-text">
                    <i class="fas fa-info-circle"></i> choose a domain and click on search
                </div>
            </div>
        </div>

        <div class="footer-note">
            <span><i class="fas fa-database"></i> Database: crawl, patterns, public profiles, SMTP</span>
            <span><i class="fas fa-lock"></i> only public &amp; simulation data</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
